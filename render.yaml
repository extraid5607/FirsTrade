services:
  - type: web
    name: firstrade
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # ONE worker only: prices and the paper-trading engine live in memory.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PRICE_SOURCE
        value: live
      - key: COOKIE_SECURE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: INVITE_CODE
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: GROWW_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_CODE
        sync: false
      - key: ANGEL_MPIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
